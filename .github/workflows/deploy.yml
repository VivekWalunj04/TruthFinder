name: Truth Finder CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend Docker image
        run: |
          docker build \
            --no-cache \
            -f ./server/Dockerfile \
            -t truth-finder-server:latest \
            .

      - name: Build frontend Docker image
        run: |
          docker build \
            --no-cache \
            -f ./client/Dockerfile \
            -t truth-finder-client:latest \
            .

      - name: Show Docker images
        run: docker images