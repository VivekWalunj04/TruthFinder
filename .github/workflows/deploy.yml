name: Truth Finder CI/CD

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 582129522735.dkr.ecr.ap-south-1.amazonaws.com
  BACKEND_REPO: truth-finder-server
  FRONTEND_REPO: truth-finder-client

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
          docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build backend image
        run: |
          docker build \
            --no-cache \
            -f ./server/Dockerfile \
            -t "$BACKEND_REPO:latest" \
            .

      - name: Build frontend image
        run: |
          docker build \
            --no-cache \
            -f ./client/Dockerfile \
            -t "$FRONTEND_REPO:latest" \
            .

      - name: Tag and push backend image
        run: |
          docker tag "$BACKEND_REPO:latest" "$ECR_REGISTRY/$BACKEND_REPO:latest"
          docker push "$ECR_REGISTRY/$BACKEND_REPO:latest"

      - name: Tag and push frontend image
        run: |
          docker tag "$FRONTEND_REPO:latest" "$ECR_REGISTRY/$FRONTEND_REPO:latest"
          docker push "$ECR_REGISTRY/$FRONTEND_REPO:latest"